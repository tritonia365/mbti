<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 공부 유형 찾기 — MBTI 공부법 연구소</title>
<meta name="description" content="10가지 공부 습관 질문으로 나의 학습 기질(NT·NF·SJ·SP)을 알아보세요">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="quiz.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">🧠 MBTI 공부법 연구소</a>
    <nav class="main-nav">
      <a href="index.html">홈</a>
      <a href="nt.html">NT 분석가</a>
      <a href="nf.html">NF 외교관</a>
      <a href="sj.html">SJ 관리자</a>
      <a href="sp.html">SP 탐험가</a>
      <a href="test.html" class="nav-cta active">내 유형 찾기</a>
    </nav>
  </div>
</header>

<main>
  <section class="section container test-wrap">

    <div id="quiz-view">
      <h1 class="section-title" style="text-align:center;">내 공부 유형 찾기</h1>
      <p class="section-desc" style="text-align:center; margin-left:auto; margin-right:auto;">
        평소 공부 습관에 가장 가까운 보기를 하나씩 골라주세요. 10문항이 끝나면 나의 학습 기질을 알려드려요.
      </p>

      <div class="progress-track">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <form id="test-form">
        <div id="quiz-questions"></div>
        <div class="test-actions">
          <button type="submit" class="btn">결과 확인하기</button>
        </div>
      </form>
    </div>

    <div id="result-view" class="hidden">
      <div class="result-card">
        <div class="group-emoji" id="result-emoji"></div>
        <h2 id="result-name"></h2>
        <div class="types-line" id="result-types"></div>
        <p class="desc" id="result-desc"></p>

        <div class="score-bars" id="result-bars"></div>

        <div class="result-actions">
          <a href="#" class="btn" id="result-link">그룹별 공부법 자세히 보기 →</a>
          <button class="btn btn-outline" id="retry-btn" type="button">다시 테스트하기</button>
          <button class="btn btn-secondary" id="share-btn" type="button">🔗 친구에게 공유하기</button>
        </div>
      </div>
    </div>

  </section>
</main>

<footer class="site-footer">
  <div class="container">
    MBTI 공부법 연구소 · 본 테스트는 재미와 참고를 위한 간이 진단이며 공식 심리검사를 대체하지 않습니다.
  </div>
</footer>

<script src="test.js"></script>
</body>
</html>
